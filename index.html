<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10121d">
<title>Bot Center</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><div class="logo">BC</div><div><b>Bot Center</b><small>منصتك لإدارة تطبيقات البوتات</small></div></div>
    <button class="lang" id="langBtn">EN</button>
  </header>
  <section class="hero">
    <div class="eyebrow" data-ar="منصة واحدة • بوتات متعددة" data-en="ONE PLATFORM • MANY BOTS">منصة واحدة • بوتات متعددة</div>
    <h1 data-ar="كل بوتاتك،<br>بمكان واحد." data-en="All your bots,<br>in one place.">كل بوتاتك،<br>بمكان واحد.</h1>
    <p data-ar="واجهة مصغّرة قابلة للتطوير، تربط خدماتك ومشاريعك داخل تيليجرام." data-en="A scalable Mini App connecting your services and projects inside Telegram.">واجهة مصغّرة قابلة للتطوير، تربط خدماتك ومشاريعك داخل تيليجرام.</p>
    <div class="hero-glow"></div>
  </section>
  <section class="section-head"><div><small data-ar="مساحة العمل" data-en="WORKSPACE">مساحة العمل</small><h2 data-ar="تطبيقاتك" data-en="Your apps">تطبيقاتك</h2></div><span class="live">● <span data-ar="متصل" data-en="ONLINE">متصل</span></span></section>
  <div class="app-card">
    <div class="app-icon">✉</div><div class="app-info"><b data-ar="بوت التواصل" data-en="Contact Bot">بوت التواصل</b><small data-ar="إرسال رسالة مباشرة إلى المطوّر" data-en="Send a direct message to the developer">إرسال رسالة مباشرة إلى المطوّر</small></div><span class="arrow">‹</span>
  </div>
  <section class="contact">
    <div class="contact-title"><div><small data-ar="تواصل مباشر" data-en="DIRECT CONTACT">تواصل مباشر</small><h2 data-ar="أرسل رسالتك" data-en="Send a message">أرسل رسالتك</h2></div><div class="bubble">↗</div></div>
    <textarea id="message" maxlength="3000" placeholder="اكتب رسالتك هنا..."></textarea>
    <div class="counter"><span id="count">0</span>/3000</div>
    <button class="send" id="sendBtn"><span data-ar="إرسال الرسالة" data-en="Send message">إرسال الرسالة</span><b>←</b></button>
    <div id="status" class="status" role="status"></div>
  </section>
  <footer><span>BOT CENTER</span><span>BUILT FOR TELEGRAM</span></footer>
</div>
<script src="/static/app.js"></script>
</body></html>
